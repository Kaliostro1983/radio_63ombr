{% extends "base.html" %}

{% block content %}
<div class="landmarks-page">
  <h2 style="margin-top:0">Орієнтири</h2>

  <div class="card" style="margin-bottom:12px">
    <form id="lmSearchForm" autocomplete="off">
      <div class="row" style="gap:12px; align-items:flex-end">
        <div class="field" style="min-width:260px; flex:1">
          <label for="lmName">Назва</label>
          <input
            id="lmName"
            name="name"
            type="text"
            placeholder="пошук за назвою..."
            list="lmNameList"
            autocomplete="off"
          />
          <datalist id="lmNameList"></datalist>
        </div>

        <div class="field" style="min-width:190px">
          <label for="lmGroupId">Підрозділ</label>
          <select id="lmGroupId">
            <option value="">Усі</option>
          </select>
        </div>

        <div class="field" style="min-width:190px">
          <label for="lmTypeId">Тип</label>
          <select id="lmTypeId">
            <option value="">Усі</option>
          </select>
        </div>

        <div class="field" style="flex:0">
          <label>&nbsp;</label>
          <div class="lm-filter-checks">
            <label class="lm-chk" title="Показати лише орієнтири, у яких сплив термін придатності">
              <input type="checkbox" id="lmExpired"><span>протерміновані</span>
            </label>
            <label class="lm-chk" title="Показати лише орієнтири без координат">
              <input type="checkbox" id="lmNoCoords"><span>без координат</span>
            </label>
          </div>
        </div>

        <div class="field" style="flex:0">
          <label>&nbsp;</label>
          <div style="display:flex; gap:10px; align-items:center; justify-content:flex-end">
            <button id="lmSearchBtn" type="button" class="lm-icon-btn" title="Шукати" aria-label="Шукати">
              <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="9" r="6"/><line x1="13.5" y1="13.5" x2="18" y2="18"/></svg>
            </button>
            <button id="lmCreateBtn" type="button" class="lm-icon-btn lm-icon-btn--accent" title="Додати орієнтир" aria-label="Додати орієнтир">
              <svg viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="10" y1="4" x2="10" y2="16"/><line x1="4" y1="10" x2="16" y2="10"/></svg>
            </button>
          </div>
        </div>
      </div>
    </form>
  </div>

  <div id="lmResultsCard" class="card">
    <div style="display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:10px">
      <div class="small" id="lmMeta"></div>
      <div class="small" id="lmLoading" style="display:none; opacity:.85">Завантаження...</div>
    </div>

    <div class="table-wrap">
      <table class="table" id="lmTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Тип</th>
            <th>Назва</th>
            <th>Підрозділ</th>
          </tr>
        </thead>
        <tbody id="lmTbody"></tbody>
      </table>
    </div>

    <div style="display:flex; justify-content:center; padding:12px 0 6px 0">
      <button id="lmLoadMoreBtn" type="button" class="secondary" style="display:none">
        Показати ще
      </button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/landmarks.js?v=20" defer></script>
{% endblock %}
